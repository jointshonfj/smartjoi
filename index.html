<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <script>
    // motiv nastav hned, ať stránka neproblikne (auto = podle systému)
    try { const t = localStorage.getItem('sj-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="app.css?v=20260925g">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">
      <img class="brand-logo" src="logo.png" alt="Jointshon | FJ" width="38" height="38">

    <nav id="crumb" class="crumb"></nav>
    <div class="row" style="margin-left:auto;gap:8px">
      <button class="btn ghost theme-btn" id="theme" title="Motiv" aria-label="Přepnout světlý / tmavý režim">◐</button>

    </div>
